name: Deploy staging

# Manual only. Needs a GitHub "staging" environment with secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID, and a variable STAGING_URL. See docs/DEPLOY.md. Production has its own
# workflow (PR 4); nothing here can touch production.
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending D1 migrations to STAGING before deploying"
        type: boolean
        default: false

permissions:
  contents: read

concurrency: deploy-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Migrations (explicit, opt-in)
        if: ${{ inputs.apply_migrations }}
        run: npm run db:migrate:staging
      - run: npm run deploy:staging
      - name: Smoke test
        run: npm run health:staging -- "${{ vars.STAGING_URL }}"
